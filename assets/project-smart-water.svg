<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">Smart Water Desalination System: in development</title>
  <desc id="desc">Project card showing the data flow: water-quality sensors and float switches, an ESP32 controller, Firebase, and a web dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#140f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="230" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .dot { opacity: 0; animation: travel 2.4s linear infinite; }
    .dot.b { animation-delay: 0.8s; }
    .dot.c { animation-delay: 1.6s; }
    @keyframes travel { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(52px); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <circle cx="900" cy="20" r="220" fill="url(#glow)"/>
    <rect width="5" height="230" fill="url(#accent)"/>

    <text x="48" y="50" class="mono" font-size="12" letter-spacing="3" fill="#a78bfa">PROJECT 02  /  EMBEDDED + IOT</text>
    <text x="48" y="94" class="sans" font-size="34" font-weight="700" fill="#f1f5f9">Smart Water Desalination System</text>
    <text x="48" y="126" class="sans" font-size="18" fill="#94a3b8">Solar-powered RO prototype with ESP32 control, safety interlocks and online monitoring</text>

    <!-- status pill -->
    <rect x="782" y="28" width="170" height="30" rx="15" fill="#2a2110" stroke="#92400e"/>
    <circle cx="802" cy="43" r="5" fill="#fbbf24"/>
    <text x="817" y="48" class="mono" font-size="12" letter-spacing="1.5" fill="#fde68a">IN DEVELOPMENT</text>

    <!-- data flow -->
    <g class="sans" font-size="15" text-anchor="middle">
      <rect x="48" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="130" y="182" fill="#e2e8f0">Sensors + floats</text>
      <rect x="264" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="346" y="182" fill="#e2e8f0">ESP32 control</text>
      <rect x="480" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="562" y="182" fill="#e2e8f0">Firebase</text>
      <rect x="696" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="778" y="182" fill="#e2e8f0">Web dashboard</text>
    </g>
    <g stroke="#334155" stroke-width="2">
      <line x1="212" y1="177" x2="264" y2="177"/>
      <line x1="428" y1="177" x2="480" y2="177"/>
      <line x1="644" y1="177" x2="696" y2="177"/>
    </g>
    <g fill="#a78bfa">
      <circle class="dot" cx="212" cy="177" r="3.5"/>
      <circle class="dot b" cx="428" cy="177" r="3.5"/>
      <circle class="dot c" cx="644" cy="177" r="3.5"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="229" rx="17.5" fill="none" stroke="#1e293b"/>
</svg>
