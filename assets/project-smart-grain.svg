<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">Smart Grain Quality Detection: prototype with live demo</title>
  <desc id="desc">Project card showing the data flow: camera frames, a TensorFlow.js model in the browser, a Socket.IO server, and a live dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1000" height="230" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .dot { opacity: 0; animation: travel 2.4s linear infinite; }
    .dot.b { animation-delay: 0.8s; }
    .dot.c { animation-delay: 1.6s; }
    @keyframes travel { 0% { opacity: 0; transform: translateX(0); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateX(52px); } }
    .live { animation: live 1.6s ease-in-out infinite; }
    @keyframes live { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .dot, .live { animation: none !important; } .dot { opacity: 0; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="230" fill="url(#bg)"/>
    <circle cx="900" cy="20" r="220" fill="url(#glow)"/>
    <rect width="5" height="230" fill="url(#accent)"/>

    <text x="48" y="50" class="mono" font-size="12" letter-spacing="3" fill="#22d3ee">PROJECT 01  /  AI + WEB</text>
    <text x="48" y="94" class="sans" font-size="34" font-weight="700" fill="#f1f5f9">Smart Grain Quality Detection</text>
    <text x="48" y="126" class="sans" font-size="18" fill="#94a3b8">In-browser image classification (Good / Bad / Wet rice) with a real-time dashboard</text>

    <!-- status pill -->
    <rect x="738" y="28" width="214" height="30" rx="15" fill="#0f2a2f" stroke="#155e75"/>
    <circle class="live" cx="758" cy="43" r="5" fill="#34d399"/>
    <text x="773" y="48" class="mono" font-size="12" letter-spacing="1.5" fill="#a5f3fc">PROTOTYPE · LIVE DEMO</text>

    <!-- data flow -->
    <g class="sans" font-size="15" text-anchor="middle">
      <rect x="48" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="130" y="182" fill="#e2e8f0">Camera frame</text>
      <rect x="264" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="346" y="182" fill="#e2e8f0">TensorFlow.js</text>
      <rect x="480" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="562" y="182" fill="#e2e8f0">Socket.IO server</text>
      <rect x="696" y="156" width="164" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <text x="778" y="182" fill="#e2e8f0">Live dashboard</text>
    </g>
    <g stroke="#334155" stroke-width="2">
      <line x1="212" y1="177" x2="264" y2="177"/>
      <line x1="428" y1="177" x2="480" y2="177"/>
      <line x1="644" y1="177" x2="696" y2="177"/>
    </g>
    <g fill="#22d3ee">
      <circle class="dot" cx="212" cy="177" r="3.5"/>
      <circle class="dot b" cx="428" cy="177" r="3.5"/>
      <circle class="dot c" cx="644" cy="177" r="3.5"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="229" rx="17.5" fill="none" stroke="#1e293b"/>
</svg>
