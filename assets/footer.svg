<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-labelledby="title">
  <title id="title">Footer: Mustakali MD, AI and IoT Developer</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="0.7" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .spark { opacity: 0; animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { opacity: 0; transform: translateX(0); } 10%, 90% { opacity: 1; } 100% { opacity: 0; transform: translateX(840px); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none !important; opacity: 0; } }
  </style>
  <rect x="180" y="24" width="840" height="1.5" fill="url(#line)"/>
  <circle class="spark" cx="180" cy="24.75" r="3" fill="#e0f2fe"/>
  <rect x="592" y="17" width="16" height="16" rx="3" transform="rotate(45 600 25)" fill="#0b1020" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="68" text-anchor="middle" class="mono" font-size="13" letter-spacing="3" fill="#64748b">MUSTAKALI MD  ·  SENSORS → SILICON → INSIGHT</text>
</svg>
